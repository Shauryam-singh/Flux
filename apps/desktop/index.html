<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flux Assistant</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>⚡ Flux</h1>
        <span class="subtitle">AI Assistant</span>
      </header>

      <div id="chat-area" class="chat-area">
        <div id="welcome" class="welcome">
          <h2>Hello! I'm Flux</h2>
          <p>Your AI assistant. Ask me anything.</p>
          <p class="hint">Hold the mic button to speak, or type below.</p>
        </div>
      </div>

      <div class="input-area">
        <button id="mic-btn" class="mic-btn" title="Hold to speak">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
        </button>
        <textarea
          id="input"
          placeholder="Type a message..."
          rows="1"
        ></textarea>
        <button id="send-btn" class="send-btn" title="Send">➤</button>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
